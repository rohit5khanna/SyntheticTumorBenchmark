dataset:
  name: synthetic_tumor_benchmark_v2_lite
  seed: 42
  output_root: ./data/synthetic_tumor_benchmark_v2_lite
  volume_shape: [96, 96, 64]
  modalities: [t1, t1ce, t2, flair]
  save_concentration: false
  overwrite: false
  patient_id_prefix: syn

schedule:
  n_sessions_min: 5
  n_sessions_max: 10
  days_interval_min: 20
  days_interval_max: 75
  treatment_patient_prob: 0.60
  treatment_start_session_min: 1

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

labeling:
  mask_threshold: 0.35

simulation:
  steps_per_day: 2
  dt: 0.10
  rho_range: [0.020, 0.090]
  dw_range: [0.040, 0.220]
  treatment_effect_range: [0.040, 0.240]
  init_foci_min: 1
  init_foci_max: 4
  init_sigma_vox_range: [1.6, 5.0]
  init_amp_range: [0.65, 1.25]

tiers:
  A:
    enabled: true
    n_patients: 90
    description: Controlled persistence / procedural growth regime
  B:
    enabled: true
    n_patients: 90
    description: Mechanistic structured isotropic growth regime
  C:
    enabled: true
    n_patients: 90
    description: Heterogeneous anisotropic reaction-diffusion regime

image_synthesis:
  noise_std: 0.030
  bias_amp: 0.14
  bias_smooth_steps: 8
  core_threshold: 0.70
  edema_threshold: 0.20
  t1_core_boost: 0.20
  t1ce_core_boost: 0.55
  t2_edema_boost: 0.45
  flair_edema_boost: 0.60
