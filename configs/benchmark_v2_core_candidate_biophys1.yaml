dataset:
  name: synthetic_tumor_benchmark_v2_core_candidate_biophys1
  seed: 42
  output_root: ./data/synthetic_tumor_benchmark_v2_core_candidate_biophys1
  volume_shape: [96, 96, 64]
  modalities: [t1, t1ce, t2, flair]
  save_concentration: false
  overwrite: false
  patient_id_prefix: syn

schedule:
  n_sessions_min: 5
  n_sessions_max: 10
  days_interval_min: 20
  days_interval_max: 75
  treatment_patient_prob: 0.60
  treatment_start_session_min: 1

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

labeling:
  mask_threshold: 0.35

simulation:
  steps_per_day: 2
  dt: 0.10
  rho_range: [0.025, 0.080]
  dw_range: [0.050, 0.180]
  treatment_effect_range: [0.040, 0.180]
  init_foci_min: 1
  init_foci_max: 3
  init_sigma_vox_range: [1.8, 4.5]
  init_amp_range: [0.70, 1.15]
  procedural_step_divisor: 8.0
  procedural_seed_count_range: [1, 3]
  procedural_radius_x_range: [1, 3]
  procedural_radius_y_range: [1, 3]
  procedural_radius_z_range: [1, 2]
  procedural_shift_prob: 0.20
  procedural_shift_x_range: [-1, 1]
  procedural_shift_y_range: [-1, 1]
  procedural_shift_z_range: [0, 0]
  procedural_offshoot_prob: 0.08
  procedural_offshoot_x_range: [-6, 6]
  procedural_offshoot_y_range: [-6, 6]
  procedural_offshoot_z_range: [-3, 3]
  procedural_offshoot_radius_x_range: [1, 1]
  procedural_offshoot_radius_y_range: [1, 1]
  procedural_offshoot_radius_z_range: [1, 1]

tiers:
  A:
    enabled: true
    n_patients: 90
    description: Controlled persistence / procedural growth regime
    simulation_overrides:
      init_foci_min: 1
      init_foci_max: 2
      init_sigma_vox_range: [1.5, 2.8]
      init_amp_range: [0.55, 0.85]
      procedural_step_divisor: 18.0
      procedural_seed_count_range: [1, 2]
      procedural_radius_x_range: [1, 2]
      procedural_radius_y_range: [1, 2]
      procedural_radius_z_range: [1, 1]
      procedural_shift_prob: 0.08
      procedural_shift_x_range: [0, 1]
      procedural_shift_y_range: [0, 1]
      procedural_shift_z_range: [0, 0]
      procedural_offshoot_prob: 0.02
      procedural_offshoot_x_range: [-3, 3]
      procedural_offshoot_y_range: [-3, 3]
      procedural_offshoot_z_range: [-1, 1]
    image_synthesis_overrides:
      noise_std: 0.025
      bias_amp: 0.12

  B:
    enabled: true
    n_patients: 90
    description: Mechanistic structured isotropic growth regime
    simulation_overrides:
      rho_range: [0.045, 0.085]
      dw_range: [0.070, 0.160]
      treatment_effect_range: [0.020, 0.100]
      init_foci_min: 1
      init_foci_max: 2
      init_sigma_vox_range: [1.8, 3.8]
      init_amp_range: [0.75, 1.05]
    image_synthesis_overrides:
      noise_std: 0.030

  C:
    enabled: true
    n_patients: 90
    description: Heterogeneous anisotropic reaction-diffusion regime
    schedule_overrides:
      n_sessions_min: 6
      n_sessions_max: 10
      days_interval_min: 20
      days_interval_max: 75
    simulation_overrides:
      rho_range: [0.055, 0.095]
      dw_range: [0.080, 0.200]
      treatment_effect_range: [0.015, 0.090]
      init_foci_min: 2
      init_foci_max: 4
      init_sigma_vox_range: [2.0, 5.0]
      init_amp_range: [0.85, 1.25]
    image_synthesis_overrides:
      noise_std: 0.035
      bias_amp: 0.16

image_synthesis:
  noise_std: 0.030
  bias_amp: 0.14
  bias_smooth_steps: 8
  core_threshold: 0.70
  edema_threshold: 0.20
  t1_core_boost: 0.20
  t1ce_core_boost: 0.55
  t2_edema_boost: 0.45
  flair_edema_boost: 0.60
